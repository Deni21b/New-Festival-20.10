<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стани участник</title>
 
    <style>
        body {
            background-color: #fff8e7;
            font-family: Arial, sans-serif;
            font-size: 18px;
            margin: 0;
        }
        .header {
            background-color: #6a1b9a;
            color: #ffd54f;
            text-align: center;
            padding: 25px;
        }
        .form-box {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border: 3px solid #6a1b9a;
            border-radius: 15px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #1e88e5;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #ff6f00;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            color: #d81b60;
        }
    </style>
</head>
<body>
 
    <header class="header">
        <h1>Стани участник!</h1>
    </header>
 
    <div class="form-box">
        <form action="#" method="post">
            <label for="names">Имена на участника:</label>
            <input type="text" id="names" name="names" required>
 
            <label for="email">Имейл:</label>
            <input type="email" id="email" name="email" required>
 
            <label for="phone">Телефон:</label>
            <input type="tel" id="phone" name="phone">
 
            <label for="talent">С какво искаш да участваш?</label>
            <textarea id="talent" name="talent" rows="4"></textarea>
 
            <button type="submit" class="btn">Изпрати</button>
        </form>
    </div>
 
    <a class="back-link" href="festival.html">← Обратно към фестивала</a>
 
</body>
</html>
